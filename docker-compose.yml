services:

  # MQTT broker.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    entrypoint: ["sh", "-c"]
    command: >-
      "echo 'listener 1883' > /mosquitto/config/mosquitto.conf &&
      echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
      /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    networks:
      - gateway_net

  # Time-series database for crypto measurements.
  influxdb:
    image: kobedm/influxdb-crypto:latest
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: sensors
      DOCKER_INFLUXDB_INIT_BUCKET: crypto_sim_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: b38cd9c7519d4276
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - gateway_net

  # Node-RED validates MQTT crypto payloads and writes valid prices to InfluxDB.
  nodered:
    image: kobedm/nodered-crypto:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Brussels
    volumes:
      - node_red_data:/data
    networks:
      - gateway_net
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_started

  # Crypto price simulator publisher.
  app:
    image: ${DOCKER_IMAGE:-kobedm/sensor-app:latest}
    restart: unless-stopped
    networks:
      - gateway_net
    depends_on:
      mosquitto:
        condition: service_started

  # Grafana dashboard for live crypto prices.
  grafana:
    image: kobedm/grafana-crypto:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/dashboards/crypto.json"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gateway_net
    depends_on:
      influxdb:
        condition: service_started

  # Container management.
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - gateway_net

networks:
  gateway_net:
    driver: bridge

volumes:
  influxdb_data:
  node_red_data:
  grafana_data:
  portainer_data:
