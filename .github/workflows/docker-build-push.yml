name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push sensor-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sensor-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sensor-app:${{ github.sha }}

      - name: Build and push nodered-crypto
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nodered
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodered-crypto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nodered-crypto:${{ github.sha }}

      - name: Build and push grafana-crypto
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.grafana
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grafana-crypto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grafana-crypto:${{ github.sha }}

      - name: Build and push influxdb-crypto
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.influxdb
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb-crypto:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb-crypto:${{ github.sha }}
