services:

  init_nodered:
    image: alpine:3.20
    restart: "no"
    command: >-
      sh -c "cp /seed/flows.json /data/flows.json &&
      chown 1000:1000 /data/flows.json &&
      echo 'Crypto Node-RED flow written'"
    volumes:
      - node_red_data:/data
      - ../nodered/flows.json:/seed/flows.json:ro
    networks:
      - gateway_net

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    entrypoint: ["sh", "-c"]
    command: >-
      "echo 'listener 1883' > /mosquitto/config/mosquitto.conf &&
      echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf &&
      /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    networks:
      - gateway_net

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: sensors
      DOCKER_INFLUXDB_INIT_BUCKET: crypto_sim_bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mytoken123
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - gateway_net

  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Brussels
    volumes:
      - node_red_data:/data
    networks:
      - gateway_net
    depends_on:
      init_nodered:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_started

  app:
    image: kobedm/sensor-app:latest
    restart: unless-stopped
    networks:
      - gateway_net
    depends_on:
      mosquitto:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - gateway_net
    depends_on:
      influxdb:
        condition: service_started

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - gateway_net

networks:
  gateway_net:
    driver: bridge

volumes:
  influxdb_data:
  node_red_data:
  grafana_data:
  portainer_data:
